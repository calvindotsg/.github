name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The project's version. Most of these projects print it with `--version`; if this one
        does not, the commit SHA or release tag is just as good.
      placeholder: "e.g. 0.2.1, or a commit SHA"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "e.g. macOS 15.4, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output / screenshots
      description: >-
        Paste any error messages or attach screenshots. **Please redact secrets first** —
        tokens, API keys, connection strings and private paths. Issues are public, and GitHub's
        automatic secret scanning only recognises well-known provider token formats.
    validations:
      required: false
