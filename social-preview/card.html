<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview card</title>
<style>
    /*
     * THE PALETTE IS calvin.sg's, NOT A NEW ONE, and both of the site's themes are here because
     * the site has two. calvin.sg serves Latte by day and Mocha by night; a social card is a
     * static PNG and cannot switch, so ONE of them has to be chosen once, for everybody.
     *
     * Light is the default, and it is chosen on legibility rather than taste. An unfurl is
     * rendered small — the Telegram card this was checked against is about 590px wide, roughly
     * a 2.2x downscale, and Slack's is smaller again. Downsampling thins strokes, and thin
     * light-on-dark type loses more to it than dark-on-light does, because the bright glyph
     * bleeds into the dark ground rather than the other way about. Light also puts the brand on
     * its real ink — primary-600 #A82334, the deep red the site only uses in Latte; the dark
     * theme's #F3A3AA is a pale accommodation for a dark ground, not the brand colour.
     *
     * Dark is kept and reachable with `--theme dark`, because it wins on one real axis: a dark
     * card is unmistakable in a feed of white GitHub default cards. Render both and look before
     * changing the default — `--render-only --theme dark` costs nothing.
     */
    :root {
        --canvas: #FAFAFA;   /* grey-50        — site --background (light) */
        --card: #F5F5F5;     /* grey-100       — site --card-background */
        --rule: #E5E5E5;     /* grey-200       — site --card-border */
        --ink: #0B0B0B;      /* darkslate-900  — site --text */
        --muted: #52525B;
        --dim: #8A8A8F;
        --accent: #A82334;   /* primary-600    — site --accent / --brand-ink */
        --terminal-bg: #16181D;  /* the install chip is a real terminal on the light card */
        --terminal-ink: #F5F5F5;
    }

    :root[data-theme="dark"] {
        --canvas: #111111;   /* darkslate-700 — site --background */
        --card: #171717;     /* darkslate-500 — site --card-background */
        --rule: #2C2C2C;     /* darkslate-100 — site --card-border */
        --ink: #FAFAFA;      /* grey-50       — site --text */
        --muted: #A3A3A3;
        --dim: #6E6E6E;
        --accent: #F3A3AA;   /* primary-200   — site --shadow / --brand-ink */
        --terminal-bg: #0D0D0D;
        --terminal-ink: var(--ink);
    }

    /* Theme-independent, so declared once and outside both blocks above. */
    :root {
        /* Filled per card from the repository's own primaryLanguage.color, which GitHub's
         * GraphQL API returns straight out of linguist. Falls back to the brand accent for a
         * repository that has no language — which is the honest answer for a profile README. */
        --lang: var(--accent);

        /* GitHub's own template marks a 40pt border as the zone its crops may eat. That
         * margin is not padding here: it is where the slab lives, so the single element that
         * can be cropped without costing the reader anything is the only decorative one. */
        --safe: 40px;
        --offset: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 1280px; height: 640px; overflow: hidden; }

    body {
        background: var(--canvas);
        /*
         * TWO FACES, EACH WITH A JOB. The display/body face is the stack calvin.sg serves, so
         * a card and the page it links to set prose identically — SF Pro here.
         */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
    }

    /*
     * The utility face. Every repository behind these cards is something you install and run
     * from a shell — two CLIs, a Homebrew tap, a machine's community-health defaults — so the
     * machine-readable half of the card (handle, language, licence, topics) is set in the
     * font that account's terminal actually uses, and the prose half is not. FiraCode is
     * named first and `ui-monospace` catches any machine that lacks it.
     */
    .mono {
        font-family: "FiraCode Nerd Font", "Fira Code", ui-monospace, "SF Mono", Menlo, monospace;
        font-variant-ligatures: none;
    }

    /*
     * THE SIGNATURE, AND THE ONE PLACE THIS CARD SPENDS BOLDNESS. calvin.sg sets its portrait
     * on an offset flat slab rather than a blurred shadow; that motif is inherited here so the
     * account's cards read as one set. What is new is that the slab is not brand pink — it is
     * the repository's primary-language colour, so the same element that ties the set together
     * also tells one repository from another before a word has been read. The dot beside the
     * language name in the meta row is the legend that makes the code legible.
     */
    .slab {
        position: absolute;
        inset: var(--safe);
        transform: translate(var(--offset), var(--offset));
        background: var(--lang);
        border-radius: 20px;
    }

    /*
     * THE LANGUAGE BAR, AND WHY IT IS WORTH COPYING FROM GITHUB. It is the one thing the
     * generated card carried that a single language name cannot replace: TypeScript at 81% of a
     * repository and TypeScript at 51% are different facts, and the bar is the only element here
     * that says which. Segment widths are byte shares straight from the languages API and the
     * colours are linguist's, so this is the same widget GitHub draws above a file list.
     *
     * It also explains the slab. The slab is the dominant segment, enlarged — once the two are
     * on the same card the colour coding stops needing a caption.
     */
    .langbar {
        margin-top: 52px;
        height: 7px;
        display: flex;
        border-radius: 4px;
        overflow: hidden;
        /* A flex item in a column that is running out of room shrinks BEFORE it overflows, and
         * a 7px bar shrinks to nothing without any visible sign that it did. It silently
         * disappeared on exactly the cards carrying an install chip — the tallest ones — while
         * rendering fine on the others, which reads as "the bar works" if you only check one. */
        flex: 0 0 auto;
    }

    /* When the bar is present it REPLACES the meta row's rule rather than sitting beside it.
     * The divider between the prose and the metadata was always going to be a horizontal line
     * across the card; making that line the language breakdown means the structural element
     * carries information instead of merely separating. Repositories with no detected language
     * keep the plain rule, which is what the fallback below is. */
    .card.has-langbar .meta {
        margin-top: 22px;
        padding-top: 0;
        border-top: none;
    }

    .langbar > span { height: 100%; }
    .langbar[hidden] { display: none; }

    .card {
        position: absolute;
        inset: var(--safe);
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 20px;
        padding: 58px 66px;
        display: flex;
        flex-direction: column;
        /* Centred as ONE stack rather than pushed to both ends. Identity against the top edge
         * and meta against the bottom leaves a void through the middle that reads as a
         * rendering fault; the same slack split evenly above and below reads as margin. */
        justify-content: center;
    }

    .owner {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--accent);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0.01em;
    }

    .owner svg { width: 27px; height: 27px; fill: var(--accent); }

    /*
     * THE AVATAR IS IDENTITY, AND DROPPING IT WAS A REGRESSION. GitHub's generated card carries
     * it, and a reader recognises a face faster than they read a handle — on a personal
     * account, where the repositories are the portfolio, that is most of what the card is for.
     *
     * It gets a plain frame and NOT a slab of its own. calvin.sg sets its portrait on an offset
     * slab and that motif is already spent on the card behind this one; two offset slabs on one
     * 1280x640 card is the accessory to take off before leaving the house.
     */
    .identity { display: flex; align-items: flex-start; gap: 44px; }
    .identity-text { min-width: 0; flex: 1; }

    .avatar {
        flex: 0 0 auto;
        width: 168px;
        height: 168px;
        border-radius: 24px;
        border: 1px solid var(--rule);
        object-fit: cover;
        /* Optically aligned with the cap-height of the handle above the name, rather than the
         * top of its line box. */
        margin-top: 6px;
    }

    .name {
        margin-top: 24px;
        color: var(--ink);
        font-size: 88px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
        /* Inline-block AND nowrap so the element's own width is the width of the name.
         * As a block it would report the column's width no matter how short the name,
         * which is a measurement that silently drives the fitting loop below to its
         * floor on every card. */
        display: inline-block;
        white-space: nowrap;
    }

    .desc {
        margin-top: 20px;
        color: var(--muted);
        font-size: 32px;
        font-weight: 400;
        line-height: 1.38;
        max-width: 1010px;
        /* Two lines is the budget. A third collides with the meta row, and a card that grows
         * a scrollbar renders as a card with its last line sliced in half. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /*
     * THE ONE LINE GITHUB'S GENERATED CARD CANNOT DRAW, and the reason a custom card exists at
     * all. An install command is in no GitHub metadata field, so no card built from metadata can
     * ever show it — while everything else here (name, description, language, counters) the
     * default card already draws, live, and better. A card without this element is a downgrade;
     * `scripts/social-preview.sh` refuses to upload one without being forced.
     *
     * Set as a terminal line rather than a button, because that is where the command is going to
     * be typed, and the card is already speaking that language in its utility face.
     */
    .install {
        margin-top: 30px;
        display: inline-flex;
        align-items: baseline;
        gap: 16px;
        max-width: 100%;
        padding: 18px 26px;
        /* A real terminal, not a recessed panel. On the light card this is the one dark
         * element, which is exactly right: it is the only part of the card the reader is meant
         * to copy into a shell, and it looks like where it is going. */
        background: var(--terminal-bg);
        border: 1px solid var(--rule);
        border-radius: 12px;
        color: var(--terminal-ink);
        font-size: 28px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
    }

    /* The prompt carries the language colour, tying the command to the slab behind the card. */
    /* `display: inline-flex` outranks the `hidden` attribute's UA `display: none`, so without
     * this a repository with no install command draws an empty black pill. */
    .install[hidden] { display: none; }

    .install .prompt { color: var(--lang-true, var(--lang)); font-weight: 700; }

    .meta {
        flex: 0 0 auto;
        margin-top: 52px;
        padding-top: 26px;
        /* The rule is structural: it separates what a person reads from what a machine
         * recorded. Everything above it is prose, everything below it is repository metadata. */
        border-top: 1px solid var(--rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
    }

    .facts {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--muted);
        font-size: 24px;
        font-weight: 500;
        white-space: nowrap;
    }

    .facts .sep { color: var(--dim); }

    .lang-name { display: flex; align-items: center; gap: 11px; }

    .dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--lang-true, var(--lang));
    }

    .star { display: flex; align-items: center; gap: 8px; }
    .star svg { width: 21px; height: 21px; fill: var(--muted); }

    /* Topics are set as plain text rather than pills. A bordered pill inside a bordered card
     * inside a bordered slab is a third box saying nothing the words do not. */
    .topics {
        color: var(--dim);
        font-size: 23px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
    }
</style>
</head>
<body>
<div class="slab" id="slab"></div>
<div class="card">
    <div class="identity">
      <div class="identity-text">
        <div class="owner mono">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path></svg>
            <span id="owner"></span>
        </div>
        <div class="name" id="name"></div>
        <div class="desc" id="desc"></div>
        <div class="install mono" id="install" hidden></div>
      </div>
      <img class="avatar" id="avatar" alt="" hidden>
    </div>
    <div class="langbar" id="langbar" hidden></div>
    <div class="meta">
        <div class="facts mono" id="facts"></div>
        <div class="topics mono" id="topics"></div>
    </div>
</div>

<script>
    /*
     * The generator replaces the object between the two markers with one repository's
     * metadata, read live from GitHub's GraphQL API. Leaving a real sample in place is
     * deliberate: opening this file directly draws a finished card, so the design can be
     * worked on without running anything.
     */
    const CARD = /*__CARD_DATA__*/ {
        owner: "calvindotsg",
        name: "mac-upkeep",
        description: "Zero-config CLI that runs unified macOS maintenance — caches, updates, services — on boot and weekly via launchd",
        language: "Python",
        languageColor: "#3572A5",
        license: "MIT",
        stars: 2,
        topics: ["automation", "cli", "homebrew"],
        install: "brew install calvindotsg/tap/mac-upkeep",
        theme: "light",
        avatar: null,
        languages: [{name: "Python", color: "#3572A5", size: 100}]
    } /*__END_CARD_DATA__*/;

    const $ = (id) => document.getElementById(id);

    if (CARD.theme === "dark") document.documentElement.dataset.theme = "dark";

    if (CARD.avatar) {
        const a = $("avatar");
        a.src = CARD.avatar;
        a.hidden = false;
    }

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    /*
     * THE SLAB IS PUSHED AWAY FROM THE CANVAS, IN WHICHEVER DIRECTION THE CANVAS IS.
     *
     * linguist's palette was chosen to read as a 12px dot on a white repository list, not as a
     * 1200px slab, and at this size some of it disappears — but WHICH entries disappear flips
     * with the theme. Measured against the two canvases: Ruby #701516 is 1.63:1 on the dark
     * canvas and 11.13:1 on the light one; Shell #89e051 is the exact mirror, 11.55:1 on dark
     * and 1.57:1 on light. An earlier version of this only ever blended toward white, which was
     * right while dark was the default and became precisely wrong when light became it —
     * lightening the colours that were already fine and ignoring the ones that had gone faint.
     *
     * So the rule is stated once, in terms of the canvas rather than a direction: step the
     * colour away from the canvas until it clears a contrast floor. The floor is deliberately
     * low, because the slab has to be SEEN rather than read, and a high floor would drag every
     * language toward the same value and destroy the thing the slab is for — at which point the
     * tap and the profile README would wear the same colour for opposite reasons.
     */
    function relLuminance(rgb) {
        const chan = (c) => {
            const v = c / 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * chan(rgb[0]) + 0.7152 * chan(rgb[1]) + 0.0722 * chan(rgb[2]);
    }

    function contrast(a, b) {
        const la = relLuminance(a), lb = relLuminance(b);
        return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }

    function parseHex(hex) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
        if (!m) return null;
        const n = parseInt(m[1], 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function separateFromCanvas(hex, canvasHex, target) {
        const base = parseHex(hex);
        const canvas = parseHex(canvasHex);
        if (!base || !canvas) return null;
        // Away from the canvas: toward black on a light ground, toward white on a dark one.
        const toward = relLuminance(canvas) > 0.4 ? 0 : 255;
        let rgb = base.slice();
        for (let t = 0; t <= 0.9 && contrast(rgb, canvas) < target; t += 0.02) {
            rgb = base.map((c) => Math.round(c + (toward - c) * t));
        }
        return "#" + rgb.map((c) => c.toString(16).padStart(2, "0")).join("");
    }

    const trueColor = CARD.languageColor || null;
    const canvasColor = getComputedStyle(document.documentElement)
        .getPropertyValue("--canvas").trim();
    const slabColor = separateFromCanvas(trueColor, canvasColor, 2.2);
    if (slabColor) {
        document.documentElement.style.setProperty("--lang", slabColor);
        document.documentElement.style.setProperty("--lang-true", trueColor);
    }

    $("owner").textContent = CARD.owner + "/";
    $("name").textContent = CARD.name;
    $("desc").textContent = CARD.description || "";

    /*
     * THE HEADLINE IS SIZED TO THE NAME IT WAS GIVEN, not to a number chosen once for the
     * longest name in the account today. `granola-to-minutes` overflows a card set for
     * `mac-upkeep`, and the next repository could be longer than either. Stepping down by
     * measured width keeps every name on one line with no table of exceptions to maintain —
     * and, unlike a CSS clamp, it cannot silently drop the second half of a name.
     */
    const nameEl = $("name");
    const NAME_BUDGET = CARD.avatar ? 800 : 1010;
    for (let size = 88; size >= 42 && nameEl.offsetWidth > NAME_BUDGET; size -= 2) {
        nameEl.style.fontSize = size + "px";
    }

    /* A long description clamps to two lines at full size and loses its tail. One step down
     * usually buys the whole sentence; below that it stops being legible in a Slack unfurl, so
     * the clamp takes over and the tail is dropped on purpose rather than by accident. */
    if ((CARD.description || "").length > 88) $("desc").style.fontSize = "29px";

    if (CARD.install) {
        const el = $("install");
        el.hidden = false;
        el.innerHTML = '<span class="prompt">$</span><span id="cmd"></span>';
        document.getElementById("cmd").textContent = CARD.install;
        // Same treatment as the headline: step the command down until it fits on one line,
        // rather than picking a size that happens to suit today's longest command.
        for (let size = 28; size >= 18 && el.scrollWidth > (CARD.avatar ? 800 : 1010); size -= 1) {
            el.style.fontSize = size + "px";
        }
    }

    /* Segments below ~1.2% are dropped rather than drawn: at 1200px of card width they are a
     * sub-pixel sliver that reads as a rendering seam, and the remainder is renormalised so the
     * bar still spans the full width. GitHub keeps them; at this size they do not survive. */
    const langs = (CARD.languages || []).filter((l) => l.size > 0);
    if (langs.length) {
        const total = langs.reduce((n, l) => n + l.size, 0);
        const kept = langs.filter((l) => l.size / total >= 0.012);
        const keptTotal = kept.reduce((n, l) => n + l.size, 0) || 1;
        $("langbar").innerHTML = kept
            .map((l) => '<span style="width:' + (100 * l.size / keptTotal).toFixed(3) +
                        '%;background:' + (l.color || "#8A8A8F") + '"></span>')
            .join("");
        $("langbar").hidden = false;
        document.querySelector(".card").classList.add("has-langbar");
    }

    const facts = [];
    if (CARD.language) {
        facts.push('<span class="lang-name"><span class="dot"></span>' + esc(CARD.language) + "</span>");
    }
    if (CARD.license) facts.push("<span>" + esc(CARD.license) + "</span>");
    if (CARD.stars > 0) {
        facts.push('<span class="star"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path></svg>' + CARD.stars + "</span>");
    }
    $("facts").innerHTML = facts.join('<span class="sep">·</span>');

    /* With no language, licence or stars to show — a profile README is the case — the meta row
     * would push its topics to the far right against nothing, leaving a rule with one word
     * hanging off the end of it. Collapse to a single left-aligned group instead. */
    if (facts.length === 0) {
        document.querySelector(".meta").style.justifyContent = "flex-start";
    }

    /*
     * Topics are dropped from the tail until the row fits, rather than capped at a count.
     * `developer-tools` is four times the width of `cli`, so a fixed cap of three crowds one
     * card and wastes half the row on another. GitHub orders topics as the owner set them, so
     * dropping from the end drops the least deliberate ones.
     */
    const topicsEl = $("topics");
    const topics = (CARD.topics || []).slice(0, 5);
    const paint = (n) => {
        topicsEl.innerHTML = topics.slice(0, n)
            .map(esc).join('<span style="color:#3F3F3F"> · </span>');
    };
    paint(topics.length);
    for (let n = topics.length; n > 0 && topicsEl.scrollWidth > 520; n--) paint(n - 1);

    /* The renderer waits on this flag rather than a load event: the two measured passes above
     * settle after `load`, and a screenshot taken between them catches the headline
     * mid-resize. */
    document.fonts.ready.then(() => {
        document.documentElement.dataset.cardReady = "1";
    });
</script>
</body>
</html>
