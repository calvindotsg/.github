<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview card</title>
<style>
    /*
     * THE PALETTE IS calvin.sg's, NOT A NEW ONE. Canvas, card, rule, ink and accent are the
     * dark-theme tokens from portfolio-v2's `src/layouts/BasicLayout.astro`, named here by the
     * token they came from. A card system that invented its own colours would be a second
     * brand to keep in step with the site; this one goes stale only when the site does.
     */
    :root {
        --canvas: #111111;   /* darkslate-700 — site --background */
        --card: #171717;     /* darkslate-500 — site --card-background */
        --rule: #2C2C2C;     /* darkslate-100 — site --card-border */
        --ink: #FAFAFA;      /* grey-50       — site --text */
        --muted: #A3A3A3;
        --dim: #6E6E6E;
        --accent: #F3A3AA;   /* primary-200   — site --shadow / --brand-ink */

        /* Filled per card from the repository's own primaryLanguage.color, which GitHub's
         * GraphQL API returns straight out of linguist. Falls back to the brand accent for a
         * repository that has no language — which is the honest answer for a profile README. */
        --lang: var(--accent);

        /* GitHub's own template marks a 40pt border as the zone its crops may eat. That
         * margin is not padding here: it is where the slab lives, so the single element that
         * can be cropped without costing the reader anything is the only decorative one. */
        --safe: 40px;
        --offset: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 1280px; height: 640px; overflow: hidden; }

    body {
        background: var(--canvas);
        /*
         * TWO FACES, EACH WITH A JOB. The display/body face is the stack calvin.sg serves, so
         * a card and the page it links to set prose identically — SF Pro here.
         */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
    }

    /*
     * The utility face. Every repository behind these cards is something you install and run
     * from a shell — two CLIs, a Homebrew tap, a machine's community-health defaults — so the
     * machine-readable half of the card (handle, language, licence, topics) is set in the
     * font that account's terminal actually uses, and the prose half is not. FiraCode is
     * named first and `ui-monospace` catches any machine that lacks it.
     */
    .mono {
        font-family: "FiraCode Nerd Font", "Fira Code", ui-monospace, "SF Mono", Menlo, monospace;
        font-variant-ligatures: none;
    }

    /*
     * THE SIGNATURE, AND THE ONE PLACE THIS CARD SPENDS BOLDNESS. calvin.sg sets its portrait
     * on an offset flat slab rather than a blurred shadow; that motif is inherited here so the
     * account's cards read as one set. What is new is that the slab is not brand pink — it is
     * the repository's primary-language colour, so the same element that ties the set together
     * also tells one repository from another before a word has been read. The dot beside the
     * language name in the meta row is the legend that makes the code legible.
     */
    .slab {
        position: absolute;
        inset: var(--safe);
        transform: translate(var(--offset), var(--offset));
        background: var(--lang);
        border-radius: 20px;
    }

    .card {
        position: absolute;
        inset: var(--safe);
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 20px;
        padding: 58px 66px;
        display: flex;
        flex-direction: column;
        /* Centred as ONE stack rather than pushed to both ends. Identity against the top edge
         * and meta against the bottom leaves a void through the middle that reads as a
         * rendering fault; the same slack split evenly above and below reads as margin. */
        justify-content: center;
    }

    .owner {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--accent);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0.01em;
    }

    .owner svg { width: 27px; height: 27px; fill: var(--accent); }

    .name {
        margin-top: 24px;
        color: var(--ink);
        font-size: 88px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
        /* Inline-block AND nowrap so the element's own width is the width of the name.
         * As a block it would report the column's width no matter how short the name,
         * which is a measurement that silently drives the fitting loop below to its
         * floor on every card. */
        display: inline-block;
        white-space: nowrap;
    }

    .desc {
        margin-top: 20px;
        color: var(--muted);
        font-size: 32px;
        font-weight: 400;
        line-height: 1.38;
        max-width: 1010px;
        /* Two lines is the budget. A third collides with the meta row, and a card that grows
         * a scrollbar renders as a card with its last line sliced in half. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .meta {
        margin-top: 52px;
        padding-top: 26px;
        /* The rule is structural: it separates what a person reads from what a machine
         * recorded. Everything above it is prose, everything below it is repository metadata. */
        border-top: 1px solid var(--rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
    }

    .facts {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--muted);
        font-size: 24px;
        font-weight: 500;
        white-space: nowrap;
    }

    .facts .sep { color: var(--dim); }

    .lang-name { display: flex; align-items: center; gap: 11px; }

    .dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--lang-true, var(--lang));
    }

    .star { display: flex; align-items: center; gap: 8px; }
    .star svg { width: 21px; height: 21px; fill: var(--muted); }

    /* Topics are set as plain text rather than pills. A bordered pill inside a bordered card
     * inside a bordered slab is a third box saying nothing the words do not. */
    .topics {
        color: var(--dim);
        font-size: 23px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
    }
</style>
</head>
<body>
<div class="slab" id="slab"></div>
<div class="card">
    <div>
        <div class="owner mono">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path></svg>
            <span id="owner"></span>
        </div>
        <div class="name" id="name"></div>
        <div class="desc" id="desc"></div>
    </div>
    <div class="meta">
        <div class="facts mono" id="facts"></div>
        <div class="topics mono" id="topics"></div>
    </div>
</div>

<script>
    /*
     * The generator replaces the object between the two markers with one repository's
     * metadata, read live from GitHub's GraphQL API. Leaving a real sample in place is
     * deliberate: opening this file directly draws a finished card, so the design can be
     * worked on without running anything.
     */
    const CARD = /*__CARD_DATA__*/ {
        owner: "calvindotsg",
        name: "portfolio-v2",
        description: "calvin.sg — Astro site with DNS-as-code, live Strava goal tracking, and a rendered-output test suite",
        language: "TypeScript",
        languageColor: "#3178c6",
        license: "MIT",
        stars: 0,
        topics: ["astro", "portfolio", "personal-website"]
    } /*__END_CARD_DATA__*/;

    const $ = (id) => document.getElementById(id);

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    /*
     * THE SLAB IS LIFTED ONLY AS FAR AS IT HAS TO BE, AND THE DOT IS NEVER LIFTED.
     *
     * linguist's palette was chosen to read as a 12px dot on a white repository list, not as a
     * 1200px slab on a near-black canvas, and several of its entries are close to invisible
     * there — Ruby's #701516 sits at 0.02 relative luminance against a 0.006 canvas, a slab
     * you cannot see is a slab that isn't there. Blending toward white until the colour clears
     * a low floor fixes that.
     *
     * The floor is deliberately LOW. Lifting every language to a common luminance would make
     * the set consistent and destroy the thing the slab is for: Ruby lifted that far lands on
     * a pale rose within a few points of the brand accent, so the tap and the profile README
     * would wear the same colour for opposite reasons. A small lift keeps the hue — dark red
     * stays dark red — and only buys visibility.
     */
    function liftForCanvas(hex, floor) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
        if (!m) return null;
        const int = parseInt(m[1], 16);
        let rgb = [(int >> 16) & 255, (int >> 8) & 255, int & 255];
        const channel = (c) => {
            const s = c / 255;
            return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        const lum = (c) => 0.2126 * channel(c[0]) + 0.7152 * channel(c[1]) + 0.0722 * channel(c[2]);
        const base = rgb.slice();
        for (let t = 0; t <= 0.9 && lum(rgb) < floor; t += 0.02) {
            rgb = base.map((c) => Math.round(c + (255 - c) * t));
        }
        return "#" + rgb.map((c) => c.toString(16).padStart(2, "0")).join("");
    }

    const trueColor = CARD.languageColor || null;
    const slabColor = liftForCanvas(trueColor, 0.1);
    if (slabColor) {
        document.documentElement.style.setProperty("--lang", slabColor);
        document.documentElement.style.setProperty("--lang-true", trueColor);
    }

    $("owner").textContent = CARD.owner + "/";
    $("name").textContent = CARD.name;
    $("desc").textContent = CARD.description || "";

    /*
     * THE HEADLINE IS SIZED TO THE NAME IT WAS GIVEN, not to a number chosen once for the
     * longest name in the account today. `granola-to-minutes` overflows a card set for
     * `mac-upkeep`, and the next repository could be longer than either. Stepping down by
     * measured width keeps every name on one line with no table of exceptions to maintain —
     * and, unlike a CSS clamp, it cannot silently drop the second half of a name.
     */
    const nameEl = $("name");
    const NAME_BUDGET = 1010;
    for (let size = 88; size >= 42 && nameEl.offsetWidth > NAME_BUDGET; size -= 2) {
        nameEl.style.fontSize = size + "px";
    }

    /* A long description clamps to two lines at full size and loses its tail. One step down
     * usually buys the whole sentence; below that it stops being legible in a Slack unfurl, so
     * the clamp takes over and the tail is dropped on purpose rather than by accident. */
    if ((CARD.description || "").length > 88) $("desc").style.fontSize = "29px";

    const facts = [];
    if (CARD.language) {
        facts.push('<span class="lang-name"><span class="dot"></span>' + esc(CARD.language) + "</span>");
    }
    if (CARD.license) facts.push("<span>" + esc(CARD.license) + "</span>");
    if (CARD.stars > 0) {
        facts.push('<span class="star"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path></svg>' + CARD.stars + "</span>");
    }
    $("facts").innerHTML = facts.join('<span class="sep">·</span>');

    /* With no language, licence or stars to show — a profile README is the case — the meta row
     * would push its topics to the far right against nothing, leaving a rule with one word
     * hanging off the end of it. Collapse to a single left-aligned group instead. */
    if (facts.length === 0) {
        document.querySelector(".meta").style.justifyContent = "flex-start";
    }

    /*
     * Topics are dropped from the tail until the row fits, rather than capped at a count.
     * `developer-tools` is four times the width of `cli`, so a fixed cap of three crowds one
     * card and wastes half the row on another. GitHub orders topics as the owner set them, so
     * dropping from the end drops the least deliberate ones.
     */
    const topicsEl = $("topics");
    const topics = (CARD.topics || []).slice(0, 5);
    const paint = (n) => {
        topicsEl.innerHTML = topics.slice(0, n)
            .map(esc).join('<span style="color:#3F3F3F"> · </span>');
    };
    paint(topics.length);
    for (let n = topics.length; n > 0 && topicsEl.scrollWidth > 520; n--) paint(n - 1);

    /* The renderer waits on this flag rather than a load event: the two measured passes above
     * settle after `load`, and a screenshot taken between them catches the headline
     * mid-resize. */
    document.fonts.ready.then(() => {
        document.documentElement.dataset.cardReady = "1";
    });
</script>
</body>
</html>
